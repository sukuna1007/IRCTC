<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Profile - IRCTC </title>


    <!-- ========================================== -->
    <!-- BOOTSTRAP -->
    <!-- ========================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- ========================================== -->
    <!-- FONT AWESOME -->
    <!-- ========================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">


    <!-- ========================================== -->
    <!-- PROFILE CSS -->
    <!-- ========================================== -->

    <link
        rel="stylesheet"
        href="../css/profile.css">

</head>


<body>


<div class="container-fluid">

    <div class="row">


        <!-- ========================================== -->
        <!-- SIDEBAR -->
        <!-- ========================================== -->

        <div class="col-lg-3 bg-primary text-white sidebar p-4">


            <div class="text-center mb-4">


                <!-- PROFILE IMAGE -->

                <img
                    id="profileImage"
                    src="../images/secondry-logo.png"
                    alt="Profile Picture"
                    class="rounded-circle border border-3 border-white shadow"
                    width="140"
                    height="140">


                <!-- CHANGE PHOTO -->

                <div class="mt-3">

                    <label
                        for="imageUpload"
                        class="btn btn-light btn-sm">

                        <i class="fa-solid fa-camera me-2"></i>

                        Change Photo

                    </label>


                    <input
                        type="file"
                        id="imageUpload"
                        accept="image/*"
                        hidden>

                </div>


                <!-- LOGGED-IN USER NAME -->

                <h4
                    class="mt-3 profile-name">

                    User

                </h4>


                <small>

                    Passenger

                </small>


            </div>


            <!-- ========================================== -->
            <!-- SIDEBAR MENU -->
            <!-- ========================================== -->

            <div class="list-group">


                <a
                    href="profile.html"
                    class="list-group-item list-group-item-action active">

                    <i class="fa-solid fa-user me-2"></i>

                    Profile

                </a>


                <a
                    href="mybooking.html"
                    class="list-group-item list-group-item-action">

                    <i class="fa-solid fa-ticket me-2"></i>

                    My Bookings

                </a>


                <a
                    href="mybooking.html"
                    class="list-group-item list-group-item-action">

                    <i class="fa-solid fa-clock-rotate-left me-2"></i>

                    Booking History

                </a>


                <a
                    href="#"
                    class="list-group-item list-group-item-action">

                    <i class="fa-solid fa-gear me-2"></i>

                    Settings

                </a>


                <a
                    href="#"
                    id="sidebarLogout"
                    class="list-group-item list-group-item-action text-danger">

                    <i class="fa-solid fa-right-from-bracket me-2"></i>

                    Logout

                </a>


            </div>


        </div>


        <!-- ========================================== -->
        <!-- MAIN CONTENT -->
        <!-- ========================================== -->

        <div class="col-lg-9 p-4">


            <h2 class="mb-4">

                My Profile

            </h2>


            <div class="card shadow-sm rounded-4">


                <div class="card-body">


                    <!-- ========================================== -->
                    <!-- FULL NAME -->
                    <!-- ========================================== -->

                    <div class="row mb-3">

                        <div class="col-md-4 fw-bold">

                            Name

                        </div>

                        <div
                            class="col-md-8"
                            id="username">

                            -

                        </div>

                    </div>


                    <!-- ========================================== -->
                    <!-- PHONE -->
                    <!-- ========================================== -->

                    <div class="row mb-3">

                        <div class="col-md-4 fw-bold">

                            Phone

                        </div>

                        <div
                            class="col-md-8"
                            id="phone">

                            -

                        </div>

                    </div>


                    <!-- ========================================== -->
                    <!-- EMAIL -->
                    <!-- ========================================== -->

                    <div class="row mb-3">

                        <div class="col-md-4 fw-bold">

                            Email

                        </div>

                        <div
                            class="col-md-8"
                            id="email">

                            -

                        </div>

                    </div>


                    <!-- ========================================== -->
                    <!-- ADDRESS -->
                    <!-- ========================================== -->

                    <div class="row mb-3">

                        <div class="col-md-4 fw-bold">

                            Address

                        </div>

                        <div
                            class="col-md-8"
                            id="address">

                            Not Added

                        </div>

                    </div>


                    <!-- ========================================== -->
                    <!-- DATE OF BIRTH -->
                    <!-- ========================================== -->

                    <div class="row mb-3">

                        <div class="col-md-4 fw-bold">

                            Date of Birth

                        </div>

                        <div
                            class="col-md-8"
                            id="dob">

                            Not Added

                        </div>

                    </div>


                    <!-- ========================================== -->
                    <!-- ACTION BUTTONS -->
                    <!-- ========================================== -->

                    <div class="mt-4">


                        <button
                            id="editBtn"
                            type="button"
                            class="btn btn-primary me-2">

                            <i class="fa-solid fa-user-pen me-1"></i>

                            Edit Profile

                        </button>


                        <button
                            id="passwordBtn"
                            type="button"
                            class="btn btn-warning text-white me-2">

                            <i class="fa-solid fa-key me-1"></i>

                            Change Password

                        </button>


                        <button
                            id="logoutBtn"
                            type="button"
                            class="btn btn-danger">

                            <i class="fa-solid fa-right-from-bracket me-1"></i>

                            Logout

                        </button>


                    </div>


                </div>


            </div>


        </div>


    </div>


</div>


<!-- ========================================== -->
<!-- PROFILE JAVASCRIPT -->
<!-- ========================================== -->

<script src="../javascript/profile.js"></script>


<!-- ========================================== -->
<!-- BOOTSTRAP JAVASCRIPT -->
<!-- ========================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
