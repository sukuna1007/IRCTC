<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Payment Successful - IRCTC</title>


    <!-- ========================================= -->
    <!-- BOOTSTRAP -->
    <!-- ========================================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- ========================================= -->
    <!-- FONT AWESOME -->
    <!-- ========================================= -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">


    <!-- ========================================= -->
    <!-- PAGE CSS -->
    <!-- ========================================= -->

    <style>

        /* ==========================================
           RESET
        ========================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;

            margin: 0;
            padding: 0;
        }


        /* ==========================================
           BODY
        ========================================== */

        body {
            width: 100%;
            min-height: 100vh;

            margin: 0;
            padding: 0;

            font-family: "Segoe UI", Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #071a33 0%,
                #0f3f73 55%,
                #1d70b7 100%
            );

            display: flex;

            align-items: center;
            justify-content: center;
        }


        /* ==========================================
           MAIN SUCCESS CONTAINER
           ONLY SMALL LEFT / RIGHT GAP
        ========================================== */

        .success-container {
            width: 100%;
            max-width: 100%;

            margin: 0;

            padding: 25px 8px;
        }


        /* ==========================================
           SUCCESS CARD
           FULL WIDTH
        ========================================== */

        .success-card {
            position: relative;

            width: 100%;
            max-width: 100%;

            margin: 0;

            padding: 38px !important;

            border: none;

            border-radius: 18px;

            text-align: center;

            overflow: hidden;

            background: #ffffff;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25) !important;
        }


        /* ==========================================
           TOP ACCENT LINE
        ========================================== */

        .success-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 6px;

            background: linear-gradient(
                90deg,
                #0d63b7,
                #ff7900,
                #ffb000
            );
        }


        /* ==========================================
           SUCCESS ICON
        ========================================== */

        .check-icon {
            width: 90px;
            height: 90px;

            margin: 5px auto 18px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #e9f8ef;

            color: #198754;

            font-size: 50px;

            box-shadow:
                0 8px 20px rgba(25, 135, 84, 0.15);
        }


        /* ==========================================
           SUCCESS TITLE
        ========================================== */

        .success-card h3 {
            margin-top: 0 !important;
            margin-bottom: 8px;

            color: #198754 !important;

            font-size: 30px;

            font-weight: 750;
        }


        /* ==========================================
           SUCCESS MESSAGE
        ========================================== */

        .success-message {
            margin-bottom: 25px;

            color: #718096;

            font-size: 15px;
        }


        /* ==========================================
           PNR BOX
        ========================================== */

        .pnr-box {
            width: 100%;

            margin-top: 10px;

            padding: 20px;

            border: 2px dashed #198754;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #effaf3,
                #e6f6ec
            );
        }


        /* ==========================================
           PNR LABEL
        ========================================== */

        .pnr-label {
            margin-bottom: 6px;

            color: #5f6d78;

            font-size: 14px;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: 0.7px;
        }


        /* ==========================================
           PNR NUMBER
        ========================================== */

        .pnr-number {
            color: #198754;

            font-size: 30px;

            font-weight: 800;

            letter-spacing: 3px;

            word-break: break-word;
        }


        /* ==========================================
           PAYMENT INFORMATION
        ========================================== */

        .info {
            width: 100%;

            margin-top: 24px;

            padding: 22px;

            text-align: left;

            border: 1px solid #dde6ee;

            border-left: 5px solid #0d63b7;

            border-radius: 12px;

            background: #f7fafc;
        }


        /* ==========================================
           INFORMATION ROW
        ========================================== */

        .info p {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 20px;

            margin: 0;

            padding: 14px 5px;

            border-bottom: 1px solid #e5ebf0;

            color: #5a6978;

            font-size: 15px;
        }


        .info p:last-child {
            border-bottom: none;
        }


        /* ==========================================
           INFORMATION LABEL
        ========================================== */

        .info b {
            color: #263d54;

            font-weight: 700;
        }


        .info b i {
            width: 22px;

            color: #ff7900;

            text-align: center;
        }


        /* ==========================================
           INFORMATION VALUE
        ========================================== */

        .info span {
            color: #0d4f8b;

            font-weight: 650;

            text-align: right;

            word-break: break-word;
        }


        /* ==========================================
           BUTTON CONTAINER
        ========================================== */

        .action-buttons {
            width: 100%;

            margin-top: 26px;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;
        }


        /* ==========================================
           COMMON BUTTON STYLE
        ========================================== */

        .action-buttons .btn {
            min-height: 50px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            border-radius: 9px;

            font-size: 14px;

            font-weight: 700;

            transition: all 0.25s ease;
        }


        /* ==========================================
           PRINT BUTTON
        ========================================== */

        .action-buttons .btn-primary {
            border: none;

            background: #0d63b7;
        }


        .action-buttons .btn-primary:hover {
            background: #094f92;

            transform: translateY(-2px);

            box-shadow:
                0 6px 15px rgba(13, 99, 183, 0.25);
        }


        /* ==========================================
           VIEW TICKET BUTTON
        ========================================== */

        .action-buttons .btn-warning {
            border: none;

            background: #ff7900;

            color: #ffffff;
        }


        .action-buttons .btn-warning:hover {
            background: #dc6800;

            color: #ffffff;

            transform: translateY(-2px);

            box-shadow:
                0 6px 15px rgba(255, 121, 0, 0.25);
        }


        /* ==========================================
           HOME BUTTON
        ========================================== */

        .action-buttons .btn-outline-secondary {
            border: 2px solid #aab5c0;

            background: #ffffff;

            color: #536273;
        }


        .action-buttons .btn-outline-secondary:hover {
            background: #536273;

            border-color: #536273;

            color: #ffffff;

            transform: translateY(-2px);
        }


        /* ==========================================
           TABLET
        ========================================== */

        @media (max-width: 768px) {

            .success-container {
                padding: 15px 6px;
            }


            .success-card {
                padding: 28px 20px !important;

                border-radius: 15px;
            }


            .success-card h3 {
                font-size: 25px;
            }


            .check-icon {
                width: 78px;
                height: 78px;

                font-size: 43px;
            }


            .pnr-number {
                font-size: 25px;
            }


            .action-buttons {
                grid-template-columns: 1fr;
            }

        }


        /* ==========================================
           SMALL MOBILE
        ========================================== */

        @media (max-width: 480px) {

            .success-container {
                padding: 8px 4px;
            }


            .success-card {
                padding: 22px 15px !important;

                border-radius: 12px;
            }


            .success-card h3 {
                font-size: 22px;
            }


            .check-icon {
                width: 70px;
                height: 70px;

                font-size: 38px;
            }


            .pnr-box {
                padding: 16px 10px;
            }


            .pnr-number {
                font-size: 22px;

                letter-spacing: 2px;
            }


            .info {
                padding: 15px;
            }


            .info p {
                align-items: flex-start;

                flex-direction: column;

                gap: 4px;

                padding: 12px 3px;
            }


            .info span {
                text-align: left;
            }

        }


        /* ==========================================
           PRINT
        ========================================== */

        @media print {

            body {
                display: block;

                background: #ffffff;
            }


            .success-container {
                width: 100%;

                padding: 0;
            }


            .success-card {
                width: 100%;

                padding: 20px !important;

                border-radius: 0;

                box-shadow: none !important;
            }


            .no-print {
                display: none !important;
            }


            .success-card::before {
                background: #198754 !important;

                -webkit-print-color-adjust: exact;

                print-color-adjust: exact;
            }

        }

    </style>

</head>


<body>


<!-- ========================================= -->
<!-- MAIN SUCCESS CONTAINER -->
<!-- ========================================= -->

<div class="success-container">


    <!-- ========================================= -->
    <!-- SUCCESS CARD -->
    <!-- ========================================= -->

    <div class="card success-card">


        <!-- ========================================= -->
        <!-- SUCCESS ICON -->
        <!-- ========================================= -->

        <div class="check-icon">

            <i class="fa-solid fa-check"></i>

        </div>


        <!-- ========================================= -->
        <!-- TITLE -->
        <!-- ========================================= -->

        <h3>

            Payment Successful

        </h3>


        <!-- ========================================= -->
        <!-- MESSAGE -->
        <!-- ========================================= -->

        <p class="success-message">

            Your payment has been completed successfully and your ticket is confirmed.

        </p>


        <!-- ========================================= -->
        <!-- PNR -->
        <!-- ========================================= -->

        <div class="pnr-box">


            <div class="pnr-label">

                Your Booking PNR

            </div>


            <div
                id="pnr"
                class="pnr-number">

                -

            </div>


        </div>


        <!-- ========================================= -->
        <!-- PAYMENT INFORMATION -->
        <!-- ========================================= -->

        <div class="info">


            <!-- TRANSACTION ID -->

            <p>

                <b>

                    <i class="fa-solid fa-receipt"></i>

                    Transaction ID

                </b>


                <span id="txnId">

                    -

                </span>

            </p>


            <!-- AMOUNT -->

            <p>

                <b>

                    <i class="fa-solid fa-indian-rupee-sign"></i>

                    Amount

                </b>


                <span id="amount">

                    -

                </span>

            </p>


            <!-- DATE -->

            <p>

                <b>

                    <i class="fa-solid fa-calendar-days"></i>

                    Date

                </b>


                <span id="date">

                    -

                </span>

            </p>


            <!-- TIME -->

            <p>

                <b>

                    <i class="fa-solid fa-clock"></i>

                    Time

                </b>


                <span id="time">

                    -

                </span>

            </p>


        </div>


        <!-- ========================================= -->
        <!-- BUTTONS -->
        <!-- ========================================= -->

        <div class="action-buttons no-print">


            <!-- PRINT RECEIPT -->

            <button
                type="button"
                class="btn btn-primary"
                onclick="printReceipt()">

                <i class="fa-solid fa-print"></i>

                Print Receipt

            </button>


            <!-- VIEW TICKET -->

            <button
                type="button"
                class="btn btn-warning"
                onclick="goTicket()">

                <i class="fa-solid fa-ticket"></i>

                View Ticket

            </button>


            <!-- HOME -->

            <button
                type="button"
                class="btn btn-outline-secondary"
                onclick="goHome()">

                <i class="fa-solid fa-house"></i>

                Back to Home

            </button>


        </div>


    </div>


</div>


<!-- ========================================= -->
<!-- SUCCESS JAVASCRIPT -->
<!-- ========================================= -->

<script src="../javascript/success.js"></script>


</body>

</html>
