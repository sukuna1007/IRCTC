<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Passenger Booking</title>


    <!-- ========================================= -->
    <!-- BOOTSTRAP -->
    <!-- ========================================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- ========================================= -->
    <!-- FONT AWESOME -->
    <!-- ========================================= -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">


    <!-- ========================================= -->
    <!-- BOOKING CSS -->
    <!-- ========================================= -->

    <link
        rel="stylesheet"
        href="../css/booking.css">

</head>


<body>


<!-- ========================================= -->
<!-- MAIN BOOKING CONTAINER -->
<!-- ========================================= -->

<div class="container-fluid booking-container py-4">

    <div class="row justify-content-center m-0">

        <div class="col-12 p-0">


            <!-- ========================================= -->
            <!-- PASSENGER BOOKING CARD -->
            <!-- ========================================= -->

            <div class="card booking-card shadow-lg border-0 rounded-4">

                <div class="card-body p-4">


                    <!-- ========================================= -->
                    <!-- PAGE TITLE -->
                    <!-- ========================================= -->

                    <h2 class="text-center text-primary mb-4">

                        <i class="fa-solid fa-ticket"></i>

                        Passenger Booking

                    </h2>


                    <!-- ========================================= -->
                    <!-- TRAIN DETAILS -->
                    <!-- ========================================= -->

                    <div class="train-details mb-4 p-3 bg-light rounded">

                        <h5>

                            <i class="fa-solid fa-train me-2"></i>

                            Train Details

                        </h5>


                        <p>

                            <b>Train No:</b>

                            <span id="trainNo">
                                -
                            </span>

                        </p>


                        <p>

                            <b>Train Name:</b>

                            <span id="trainName">
                                -
                            </span>

                        </p>


                        <p>

                            <b>From:</b>

                            <span id="from">
                                -
                            </span>

                        </p>


                        <p>

                            <b>To:</b>

                            <span id="to">
                                -
                            </span>

                        </p>


                        <p>

                            <b>Date:</b>

                            <span id="date">
                                -
                            </span>

                        </p>


                        <p>

                            <b>Fare:</b>

                            ₹

                            <span id="fare">
                                0
                            </span>

                        </p>

                    </div>


                    <!-- ========================================= -->
                    <!-- PASSENGER FORM -->
                    <!-- ========================================= -->

                    <form id="passengerForm">


                        <!-- PASSENGER NAME -->

                        <div class="mb-3">

                            <label
                                for="name"
                                class="form-label fw-semibold">

                                Passenger Name

                            </label>


                            <input
                                type="text"
                                id="name"
                                class="form-control"
                                placeholder="Enter passenger name"
                                required>

                        </div>


                        <!-- AGE -->

                        <div class="mb-3">

                            <label
                                for="age"
                                class="form-label fw-semibold">

                                Age

                            </label>


                            <input
                                type="number"
                                id="age"
                                class="form-control"
                                placeholder="Enter age"
                                min="1"
                                max="120"
                                required>

                        </div>


                        <!-- ========================================= -->
                        <!-- GENDER -->
                        <!-- ========================================= -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">

                                Gender

                            </label>


                            <div class="d-flex gap-2 gender-buttons">


                                <!-- MALE -->

                                <input
                                    type="radio"
                                    name="gender"
                                    id="male"
                                    value="Male"
                                    checked
                                    hidden>


                                <label
                                    for="male"
                                    class="btn btn-outline-primary w-100">

                                    <i class="fa-solid fa-person me-1"></i>

                                    Male

                                </label>


                                <!-- FEMALE -->

                                <input
                                    type="radio"
                                    name="gender"
                                    id="female"
                                    value="Female"
                                    hidden>


                                <label
                                    for="female"
                                    class="btn btn-outline-danger w-100">

                                    <i class="fa-solid fa-person-dress me-1"></i>

                                    Female

                                </label>


                                <!-- OTHER -->

                                <input
                                    type="radio"
                                    name="gender"
                                    id="other"
                                    value="Other"
                                    hidden>


                                <label
                                    for="other"
                                    class="btn btn-outline-secondary w-100">

                                    Other

                                </label>

                            </div>

                        </div>


                    </form>


                    <!-- ========================================= -->
                    <!-- PAYMENT BUTTON -->
                    <!-- ========================================= -->

                    <button
                        type="button"
                        class="btn btn-primary w-100 mt-3"
                        id="paymentBtn">

                        <i class="fa-solid fa-credit-card"></i>

                        Proceed to Payment

                    </button>


                    <!-- ========================================= -->
                    <!-- PAYMENT SECURITY -->
                    <!-- ========================================= -->

                    <div class="text-center mt-3">

                        <small class="text-muted">

                            <i class="fa-solid fa-shield-halved"></i>

                            Secure payment powered by Razorpay

                        </small>

                    </div>


                </div>

            </div>

        </div>

    </div>

</div>


<!-- ========================================= -->
<!-- BOOTSTRAP JAVASCRIPT -->
<!-- ========================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


<!-- ========================================= -->
<!-- RAZORPAY CHECKOUT -->
<!-- ========================================= -->

<script
    src="https://checkout.razorpay.com/v1/checkout.js">
</script>


<!-- ========================================= -->
<!-- BOOKING JAVASCRIPT -->
<!-- ========================================= -->

<script
    src="../javascript/booking.js">
</script>


</body>

</html>
