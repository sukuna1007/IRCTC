<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Search Trains - IRCTC </title>


    <!-- =====================================================
         SEARCH PAGE CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="../css/search.css">


    <!-- =====================================================
         BOOTSTRAP 5
    ====================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

</head>


<body>


    <!-- =====================================================
         MAIN SEARCH SECTION
    ====================================================== -->

    <div class="container py-5">

        <div
            class="card shadow-lg border-0 rounded-4">

            <div class="card-body p-4">


                <!-- =================================================
                     PAGE TITLE
                ================================================== -->

                <h2
                    class="text-center text-primary fw-bold mb-4">

                    <i class="fa-solid fa-train"></i>

                    Search Trains

                </h2>



                <!-- =================================================
                     SEARCH FORM
                ================================================== -->

                <form
                    id="bookingForm"
                    class="row g-3 align-items-end">


                    <!-- =================================================
                         FROM STATION
                    ================================================== -->

                    <div class="col-lg-3 col-md-6">

                        <label
                            for="from"
                            class="form-label fw-semibold">

                            <i class="fa-solid fa-location-dot me-1"></i>

                            From

                        </label>


                        <div
                            class="station-input-wrapper position-relative">

                            <input
                                type="text"
                                id="from"
                                class="form-control"
                                placeholder="Enter From Station"
                                autocomplete="off"
                                required>

                        </div>

                    </div>



                    <!-- =================================================
                         SWAP BUTTON
                    ================================================== -->

                    <div
                        class="col-lg-1 col-md-2 d-flex justify-content-center">

                        <button
                            type="button"
                            id="swapBtn"
                            class="btn btn-outline-primary"
                            title="Swap Stations">

                            <i class="fa-solid fa-right-left"></i>

                        </button>

                    </div>



                    <!-- =================================================
                         TO STATION
                    ================================================== -->

                    <div class="col-lg-3 col-md-6">

                        <label
                            for="to"
                            class="form-label fw-semibold">

                            <i class="fa-solid fa-location-dot me-1"></i>

                            To

                        </label>


                        <div
                            class="station-input-wrapper position-relative">

                            <input
                                type="text"
                                id="to"
                                class="form-control"
                                placeholder="Enter To Station"
                                autocomplete="off"
                                required>

                        </div>

                    </div>



                    <!-- =================================================
                         JOURNEY DATE
                    ================================================== -->

                    <div class="col-lg-2 col-md-5">

                        <label
                            for="date"
                            class="form-label fw-semibold">

                            <i class="fa-solid fa-calendar-days me-1"></i>

                            Journey Date

                        </label>


                        <input
                            type="date"
                            id="date"
                            class="form-control"
                            required>

                    </div>



                    <!-- =================================================
                         TRAIN CLASS
                    ================================================== -->

                    <div class="col-lg-3 col-md-5">

                        <label
                            for="all-classes"
                            class="form-label fw-semibold">

                            <i class="fa-solid fa-chair me-1"></i>

                            Class

                        </label>


                        <select
                            id="all-classes"
                            class="form-select">

                            <option value="ALL CLASSES">
                                All Classes
                            </option>

                            <option value="1A">
                                AC First Class (1A)
                            </option>

                            <option value="2A">
                                AC 2 Tier (2A)
                            </option>

                            <option value="3A">
                                AC 3 Tier (3A)
                            </option>

                            <option value="SL">
                                Sleeper (SL)
                            </option>

                            <option value="CC">
                                AC Chair Car (CC)
                            </option>

                            <option value="2S">
                                Second Sitting (2S)
                            </option>

                        </select>

                    </div>



                    <!-- =================================================
                         SEARCH BUTTON
                    ================================================== -->

                    <div
                        class="col-12 d-flex justify-content-center mt-4">

                        <button
                            type="submit"
                            id="searchTrainBtn"
                            class="btn btn-primary px-5 py-2">

                            <i class="fa-solid fa-magnifying-glass me-2"></i>

                            Search Train

                        </button>

                    </div>

                </form>



                <!-- =================================================
                     DIVIDER
                ================================================== -->

                <hr class="my-4">



                <!-- =================================================
                     SEARCH INFORMATION
                ================================================== -->

                <div
                    id="searchInfo"
                    class="mb-3">

                </div>



                <!-- =================================================
                     LOADING
                ================================================== -->

                <div
                    id="loading"
                    class="text-center py-4"
                    style="display: none;">

                    <div
                        class="spinner-border text-primary"
                        role="status">

                        <span class="visually-hidden">
                            Loading...
                        </span>

                    </div>

                    <p class="mt-3 text-muted">

                        Searching trains...

                    </p>

                </div>



                <!-- =================================================
                     NO TRAINS
                ================================================== -->

                <div
                    id="noTrains"
                    class="text-center py-5"
                    style="display: none;">

                    <i
                        class="fa-solid fa-train-circle-xmark fa-3x text-muted mb-3">
                    </i>

                    <h5>
                        No Trains Found
                    </h5>

                    <p class="text-muted">

                        Try changing your stations or journey date.

                    </p>

                </div>



                <!-- =================================================
                     TRAIN RESULTS
                ================================================== -->

                <div
                    id="trainResults"
                    class="mt-4">

                </div>


            </div>

        </div>

    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="../javascript/search.js"></script>


</body>

</html>
