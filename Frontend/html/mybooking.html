<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Bookings - IRCTC</title>


    <!-- ================================= -->
    <!-- BOOTSTRAP -->
    <!-- ================================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- ================================= -->
    <!-- FONT AWESOME -->
    <!-- ================================= -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">


    <!-- ================================= -->
    <!-- PAGE CSS -->
    <!-- ================================= -->

    <style>

        /* ==========================================
           RESET
        ========================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }


        /* ==========================================
           BODY
        ========================================== */

        body {
            min-height: 100vh;

            font-family: "Segoe UI", Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #071a33 0%,
                #0f3f73 55%,
                #1d70b7 100%
            );

            background-attachment: fixed;
        }


        /* ==========================================
           MAIN CONTAINER
        ========================================== */

        .booking-container {
            width: 100%;
            max-width: 100%;

            margin: 0;

            padding: 30px 15px;
        }


        /* ==========================================
           MAIN CARD
        ========================================== */

        .booking-card {
            width: 100%;

            border: none;

            border-radius: 18px;

            overflow: hidden;

            background: #ffffff;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.24) !important;
        }


        /* ==========================================
           HEADER
        ========================================== */

        .booking-header {
            position: relative;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            padding: 28px 32px;

            background: linear-gradient(
                135deg,
                #0b2f5c,
                #0d63b7
            );

            color: #ffffff;
        }


        /* ORANGE TOP LINE */

        .booking-header::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 6px;

            background: linear-gradient(
                90deg,
                #ff7900,
                #ffb000
            );
        }


        /* ==========================================
           HEADER CONTENT
        ========================================== */

        .header-content {
            flex: 1;
        }


        .booking-header h2 {
            margin: 0 0 6px;

            font-size: 29px;

            font-weight: 750;

            letter-spacing: 0.3px;
        }


        .booking-header h2 i {
            margin-right: 8px;

            color: #ffad42;
        }


        .booking-header p {
            margin: 0;

            color: #d8e8f7;

            font-size: 15px;
        }


        /* ==========================================
           HOME BUTTON
        ========================================== */

        .home-btn {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            min-width: 110px;

            padding: 10px 18px;

            border: 2px solid rgba(255, 255, 255, 0.85);

            border-radius: 9px;

            background: rgba(255, 255, 255, 0.12);

            color: #ffffff;

            font-size: 15px;

            font-weight: 700;

            text-decoration: none;

            transition: all 0.25s ease;
        }


        .home-btn:hover {
            border-color: #ffad42;

            background: #ff7900;

            color: #ffffff;

            transform: translateY(-2px);

            box-shadow:
                0 6px 16px rgba(0, 0, 0, 0.18);
        }


        .home-btn i {
            font-size: 15px;
        }


        /* ==========================================
           CARD BODY
        ========================================== */

        .booking-card > .card-body {
            padding: 30px !important;

            background: #f8fafc;
        }


        /* ==========================================
           BOOKING ITEM
        ========================================== */

        .booking-item {
            position: relative;

            width: 100%;

            margin-bottom: 18px;

            padding: 22px;

            border: 1px solid #e0e7ee;

            border-left: 5px solid #0d63b7;

            border-radius: 12px;

            background: #ffffff;

            box-shadow:
                0 4px 15px rgba(14, 49, 84, 0.06);

            transition: all 0.25s ease;
        }


        .booking-item:hover {
            transform: translateY(-3px);

            border-left-color: #ff7900;

            box-shadow:
                0 10px 25px rgba(14, 49, 84, 0.12);
        }


        .booking-item:last-child {
            margin-bottom: 0;
        }


        /* ==========================================
           PNR
        ========================================== */

        .pnr {
            display: inline-block;

            color: #0d63b7;

            font-size: 18px;

            font-weight: 750;

            letter-spacing: 0.3px;
        }


        /* ==========================================
           STATUS
        ========================================== */

        .status {
            display: inline-block;

            padding: 5px 11px;

            border-radius: 20px;

            background: #e9f8ef;

            color: #198754;

            font-size: 13px;

            font-weight: 700;
        }


        .status.cancelled {
            background: #fdebec;

            color: #dc3545;
        }


        /* ==========================================
           ROUTE
        ========================================== */

        .route {
            margin-top: 12px;

            color: #173b60;

            font-size: 18px;

            font-weight: 700;
        }


        /* ==========================================
           BOOKING DETAILS
        ========================================== */

        .booking-details {
            margin-top: 12px;

            color: #607080;

            font-size: 14px;

            line-height: 1.8;
        }


        .booking-details strong {
            color: #2a3f54;

            font-weight: 700;
        }


        /* ==========================================
           ACTION BUTTONS
        ========================================== */

        .booking-actions {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            margin-top: 18px;

            padding-top: 16px;

            border-top: 1px solid #edf0f3;
        }


        /* ==========================================
           VIEW TICKET BUTTON
        ========================================== */

        .view-ticket-btn {
            min-width: 145px;

            border: none !important;

            border-radius: 8px;

            background: #0d63b7 !important;

            color: #ffffff !important;

            font-weight: 650;

            padding: 9px 16px;

            transition: all 0.25s ease;
        }


        .view-ticket-btn:hover {
            background: #094e91 !important;

            transform: translateY(-1px);

            box-shadow:
                0 5px 12px rgba(13, 99, 183, 0.20);
        }


        /* ==========================================
           CANCEL TICKET BUTTON
        ========================================== */

        .cancel-ticket-btn {
            min-width: 145px;

            border-radius: 8px;

            font-weight: 650;

            padding: 9px 16px;

            transition: all 0.25s ease;
        }


        .cancel-ticket-btn:hover:not(:disabled) {
            transform: translateY(-1px);
        }


        .cancel-ticket-btn:disabled {
            cursor: not-allowed;

            opacity: 0.55;
        }


        /* ==========================================
           CANCELLED BOOKING
        ========================================== */

        .booking-item.cancelled-booking {
            border-color: #f0c2c6;

            border-left: 5px solid #dc3545;

            background: #fffafa;
        }


        .booking-item.cancelled-booking:hover {
            border-left-color: #dc3545;
        }


        /* ==========================================
           LOADING
        ========================================== */

        #loading {
            padding: 55px 20px;

            color: #667789;
        }


        #loading .spinner-border {
            width: 42px;
            height: 42px;

            color: #ff7900 !important;
        }


        #loading p {
            font-weight: 600;
        }


        /* ==========================================
           EMPTY MESSAGE
        ========================================== */

        .empty-message {
            padding: 70px 20px;

            text-align: center;
        }


        .empty-message i {
            color: #9ba8b5 !important;
        }


        .empty-message h4 {
            color: #253e57;

            font-weight: 700;
        }


        .empty-message p {
            margin-bottom: 20px;
        }


        .empty-message .btn-primary {
            border: none;

            border-radius: 8px;

            background: #ff7900;

            padding: 10px 22px;

            font-weight: 650;
        }


        .empty-message .btn-primary:hover {
            background: #df6800;
        }


        /* ==========================================
           MODAL
        ========================================== */

        .modal-content {
            overflow: hidden;

            border: none;

            border-radius: 15px;

            box-shadow:
                0 18px 50px rgba(0, 0, 0, 0.25);
        }


        .modal-header {
            padding: 18px 22px;

            background: #f8fafc;

            border-bottom: 1px solid #e5e9ed;
        }


        .modal-title {
            color: #273e55;

            font-weight: 700;
        }


        .modal-title i {
            margin-right: 7px;
        }


        .modal-body {
            padding: 24px;

            color: #536273;
        }


        #cancelPNR {
            color: #0d63b7;

            font-weight: 700;
        }


        .modal-footer {
            padding: 15px 22px;

            background: #fafbfc;

            border-top: 1px solid #e7ebef;
        }


        .modal-footer .btn {
            min-width: 100px;

            border-radius: 8px;

            font-weight: 600;
        }


        #confirmCancelBtn {
            min-width: 180px;
        }


        /* ==========================================
           TABLET
        ========================================== */

        @media (max-width: 992px) {

            .booking-container {
                padding-left: 12px;
                padding-right: 12px;
            }


            .booking-header {
                padding: 25px;
            }


            .booking-card > .card-body {
                padding: 24px !important;
            }

        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 768px) {

            .booking-container {
                padding: 15px 8px;
            }


            .booking-card {
                border-radius: 14px;
            }


            .booking-header {
                padding: 23px 18px;

                flex-direction: column;

                align-items: flex-start;
            }


            .booking-header h2 {
                font-size: 24px;
            }


            .booking-header p {
                font-size: 14px;
            }


            .home-btn {
                width: 100%;
            }


            .booking-card > .card-body {
                padding: 16px !important;
            }


            .booking-item {
                padding: 17px;
            }


            .route {
                font-size: 16px;
            }


            .booking-actions {
                flex-direction: column;
            }


            .booking-actions .btn {
                width: 100%;
            }


            .modal-footer {
                flex-direction: column;
            }


            .modal-footer .btn {
                width: 100%;

                margin: 2px 0;
            }


            #confirmCancelBtn {
                width: 100%;
            }

        }


        /* ==========================================
           SMALL MOBILE
        ========================================== */

        @media (max-width: 480px) {

            .booking-container {
                padding-left: 5px;
                padding-right: 5px;
            }


            .booking-header h2 {
                font-size: 22px;
            }


            .booking-item {
                padding: 15px;
            }

        }


        /* ==========================================
           PRINT
        ========================================== */

        @media print {

            body {
                background: #ffffff;
            }


            .booking-container {
                padding: 0;
            }


            .booking-header {
                background: #0b2f5c !important;

                -webkit-print-color-adjust: exact;

                print-color-adjust: exact;
            }


            .home-btn {
                display: none;
            }


            .booking-actions {
                display: none;
            }


            .booking-card {
                box-shadow: none !important;
            }

        }

    </style>

</head>


<body>


<!-- ================================= -->
<!-- MAIN CONTAINER -->
<!-- ================================= -->

<div class="booking-container">


    <div class="card booking-card shadow-lg">


        <!-- ================================= -->
        <!-- HEADER -->
        <!-- ================================= -->

        <div class="booking-header">


            <div class="header-content">

                <h2>

                    <i class="fa-solid fa-ticket"></i>

                    My Bookings

                </h2>


                <p>

                    View and manage your booked train tickets

                </p>

            </div>


            <!-- ================================= -->
            <!-- HOME BUTTON -->
            <!-- ================================= -->

            <a
                href="index.html"
                class="home-btn">

                <i class="fa-solid fa-house"></i>

                Home

            </a>


        </div>


        <!-- ================================= -->
        <!-- BODY -->
        <!-- ================================= -->

        <div class="card-body">


            <!-- ================================= -->
            <!-- LOADING -->
            <!-- ================================= -->

            <div
                id="loading"
                class="text-center">


                <div
                    class="spinner-border"
                    role="status">

                    <span class="visually-hidden">
                        Loading...
                    </span>

                </div>


                <p class="mt-3 mb-0">

                    Loading bookings...

                </p>

            </div>


            <!-- ================================= -->
            <!-- BOOKING LIST -->
            <!-- ================================= -->

            <div id="bookingList"></div>


            <!-- ================================= -->
            <!-- NO BOOKINGS -->
            <!-- ================================= -->

            <div
                id="noBookings"
                class="empty-message d-none">


                <i
                    class="fa-solid fa-ticket-simple fa-3x">
                </i>


                <h4 class="mt-3">

                    No Bookings Found

                </h4>


                <p class="text-muted">

                    You have not booked any train tickets yet.

                </p>


                <a
                    href="search.html"
                    class="btn btn-primary">

                    <i class="fa-solid fa-train me-1"></i>

                    Search Trains

                </a>

            </div>


        </div>

    </div>

</div>


<!-- ================================= -->
<!-- CANCEL CONFIRMATION MODAL -->
<!-- ================================= -->

<div
    class="modal fade"
    id="cancelBookingModal"
    tabindex="-1"
    aria-hidden="true">


    <div class="modal-dialog modal-dialog-centered">


        <div class="modal-content">


            <!-- ================================= -->
            <!-- MODAL HEADER -->
            <!-- ================================= -->

            <div class="modal-header">


                <h5 class="modal-title">

                    <i
                        class="fa-solid fa-triangle-exclamation text-danger">
                    </i>

                    Cancel Booking

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>

            </div>


            <!-- ================================= -->
            <!-- MODAL BODY -->
            <!-- ================================= -->

            <div class="modal-body">


                <p>

                    Are you sure you want to cancel this booking?

                </p>


                <p class="mb-0">

                    <strong>PNR:</strong>

                    <span id="cancelPNR">
                        -
                    </span>

                </p>

            </div>


            <!-- ================================= -->
            <!-- MODAL FOOTER -->
            <!-- ================================= -->

            <div class="modal-footer">


                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    <i class="fa-solid fa-xmark"></i>

                    No

                </button>


                <button
                    type="button"
                    class="btn btn-danger"
                    id="confirmCancelBtn">

                    <i class="fa-solid fa-ban"></i>

                    Yes, Cancel Booking

                </button>

            </div>


        </div>

    </div>

</div>


<!-- ================================= -->
<!-- BOOTSTRAP JAVASCRIPT -->
<!-- ================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


<!-- ================================= -->
<!-- MY BOOKINGS JAVASCRIPT -->
<!-- ================================= -->

<script
    src="../javascript/mybooking.js">
</script>


</body>

</html>
